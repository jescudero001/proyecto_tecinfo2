<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <link rel="stylesheet" href="diseño_galeria.css">
    <script defer src="mi_script_galeria.js"></script>
</head>
<body>

    <header>
        <h1>Galería de Imágenes</h1>
        <p>Haz clic en las imágenes para ver más detalles.</p>
    </header>

    <section class="galeria">
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+1" alt="Imagen 1" class="imagen" data-id="1">
        </div>
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+2" alt="Imagen 2" class="imagen" data-id="2">
        </div>
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+3" alt="Imagen 3" class="imagen" data-id="3">
        </div>
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+4" alt="Imagen 4" class="imagen" data-id="4">
        </div>
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+5" alt="Imagen 5" class="imagen" data-id="5">
        </div>
        <div class="imagen-container">
            <img src="https://via.placeholder.com/300x200.png?text=Imagen+6" alt="Imagen 6" class="imagen" data-id="6">
        </div>
    </section>

</body>
</html>
